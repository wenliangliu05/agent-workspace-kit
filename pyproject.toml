[tool.ruff]
# 目标版本与 CI 矩阵一致：不要在 3.10 上用的写法，就别让 lint 建议
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW"]
ignore = [
    # 3.10 does not have datetime.UTC; timezone.utc is the portable spelling
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # magic values in assertions are fine
